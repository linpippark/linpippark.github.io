<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextProcessing Web App</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 配置 Tailwind CSS 以符合指定的色系
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lightBeige: '#FFE8BE', // 淺米底色
                        accentYellow: '#F7DD7D', // 強調黃色
                        primaryBlue: '#406AAF', // 主色藍
                        secondaryBlue: '#427AB5' // 次色藍
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 全局統一自訂滾動條，適配新色系 */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #FFE8BE;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #427AB5;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #406AAF;
        }
        
        /* 頁籤切換動畫邏輯 */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .tab-content.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-lightBeige min-h-screen flex flex-col font-sans text-gray-800">

    <!-- 最上方顯示 TextProcessing -->
    <header class="bg-primaryBlue p-5 shadow-md flex justify-center items-center z-10 relative">
        <h1 class="text-lightBeige text-3xl font-bold tracking-widest drop-shadow-md">
            TextProcessing
        </h1>
    </header>

    <!-- TAB 切換選單 -->
    <nav class="flex justify-center bg-secondaryBlue shadow-md sticky top-0 z-20">
        <button class="tab-btn active px-8 py-4 font-bold bg-accentYellow text-primaryBlue transition-all duration-300 transform" onclick="switchTab(event, 'tab1')">TextShower</button>
        <button class="tab-btn px-8 py-4 font-bold text-lightBeige hover:bg-primaryBlue transition-all duration-300 transform" onclick="switchTab(event, 'tab2')">TextTear</button>
        <button class="tab-btn px-8 py-4 font-bold text-lightBeige hover:bg-primaryBlue transition-all duration-300 transform" onclick="switchTab(event, 'tab3')">TextPrompt</button>
        <button class="tab-btn px-8 py-4 font-bold text-lightBeige hover:bg-primaryBlue transition-all duration-300 transform" onclick="switchTab(event, 'tab4')">Tool 04</button>
    </nav>

    <!-- 內容區域 -->
    <main class="flex-grow p-6 flex flex-col items-center w-full max-w-5xl mx-auto">
        
        <!-- =================== TAB 1: TextShower =================== -->
        <div id="tab1" class="tab-content active w-full bg-white p-8 rounded-2xl shadow-xl flex-col gap-6 border-t-8 border-primaryBlue">
            <h2 class="text-2xl font-bold text-primaryBlue flex items-end gap-2 border-b-2 border-lightBeige pb-2">
                TextShower 
                <span id="ts-version" class="text-sm font-normal text-secondaryBlue mb-1"></span>
            </h2>
            
            <textarea id="ts-input" class="w-full h-80 bg-lightBeige bg-opacity-30 border border-secondaryBlue text-gray-800 p-5 rounded-xl text-lg focus:outline-none focus:ring-4 focus:ring-accentYellow resize-none shadow-inner transition-all leading-relaxed" placeholder="請輸入欲處理的文字..."></textarea>
            
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <button id="ts-process-btn" class="w-full md:w-auto bg-accentYellow text-primaryBlue font-bold py-3 px-12 rounded-xl shadow-md hover:bg-yellow-400 hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 active:translate-y-0">
                    Shower!
                </button>
                
                <div class="w-full flex-grow flex flex-col gap-2">
                    <div id="ts-status-text" class="text-sm text-primaryBlue text-right h-5 font-bold tracking-wide"></div>
                    <div class="w-full bg-lightBeige rounded-full h-3 overflow-hidden shadow-inner border border-secondaryBlue/20">
                        <div id="ts-progress-bar" class="bg-primaryBlue h-full w-0 transition-all duration-500 rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- =================== TAB 2: TextTear =================== -->
        <div id="tab2" class="tab-content w-full bg-white p-8 rounded-2xl shadow-xl flex-col gap-6 border-t-8 border-primaryBlue">
            <h2 class="text-2xl font-bold text-primaryBlue flex items-end gap-2 border-b-2 border-lightBeige pb-2">
                TextTear 
                <span id="tt-version" class="text-sm font-normal text-secondaryBlue mb-1"></span>
            </h2>

            <div class="flex flex-col gap-2 h-64 md:h-72">
                <textarea id="tt-input" class="w-full h-full bg-lightBeige bg-opacity-30 border border-secondaryBlue text-gray-800 p-5 rounded-xl focus:ring-4 focus:ring-accentYellow focus:outline-none resize-none shadow-inner text-lg leading-relaxed transition-all" placeholder="請在此貼上文章..."></textarea>
            </div>

            <div class="flex flex-col items-center gap-4 min-h-[5rem]">
                <button id="tt-process-btn" onclick="processTextTear()" class="bg-accentYellow text-primaryBlue font-bold text-lg px-12 py-3 rounded-full shadow-md hover:bg-yellow-400 hover:shadow-lg transition duration-300 ease-in-out transform hover:-translate-y-1 active:translate-y-0 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none">
                    Tear!
                </button>
                
                <div id="tt-progress-container" class="w-full max-w-sm hidden flex-col gap-2 items-center transition-opacity duration-300 opacity-0">
                    <span id="tt-progress-text" class="text-primaryBlue text-xs font-bold tracking-wider">處理進度: 0%</span>
                    <div class="w-full bg-lightBeige rounded-full h-2 shadow-inner border border-secondaryBlue/20 overflow-hidden">
                        <div id="tt-progress-bar" class="bg-primaryBlue h-full rounded-full transition-all duration-100 ease-linear" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-2 h-80 md:h-80 relative">
                <textarea id="tt-output" readonly class="w-full h-full bg-gray-50 border border-secondaryBlue text-gray-800 p-5 rounded-xl focus:outline-none resize-none shadow-inner text-lg leading-relaxed transition-all"></textarea>
                
                <button onclick="copyToClipboardTT()" class="absolute bottom-5 right-5 bg-primaryBlue text-lightBeige font-bold px-6 py-2 rounded-lg shadow-md hover:bg-secondaryBlue transition duration-300 ease-in-out transform hover:scale-105">
                    複製全部
                </button>
            </div>
        </div>

        <!-- =================== TAB 3: TextPrompt =================== -->
        <div id="tab3" class="tab-content w-full bg-white p-8 rounded-2xl shadow-xl flex-col gap-6 border-t-8 border-primaryBlue">
            <h2 class="text-2xl font-bold text-primaryBlue flex items-end gap-2 border-b-2 border-lightBeige pb-2">
                TextPrompt 
            </h2>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mt-2">
                
                <!-- 左側：輸入控制區 -->
                <section class="lg:col-span-5 space-y-6">
                    <!-- Text Inputs -->
                    <div class="space-y-4">
                        <div>
                            <label for="tp-dec" class="block text-sm font-bold text-primaryBlue mb-1">DEC (Technology/Product Name)</label>
                            <input type="text" id="tp-dec" placeholder="e.g., Artificial Intelligence" 
                                class="w-full px-4 py-3 bg-lightBeige bg-opacity-30 border border-secondaryBlue rounded-xl focus:outline-none focus:ring-4 focus:ring-accentYellow transition-all text-gray-800">
                        </div>
                        <div>
                            <label for="tp-ipc" class="block text-sm font-bold text-primaryBlue mb-1">IPC (Field/Classification)</label>
                            <input type="text" id="tp-ipc" placeholder="e.g., Medical Image Analysis" 
                                class="w-full px-4 py-3 bg-lightBeige bg-opacity-30 border border-secondaryBlue rounded-xl focus:outline-none focus:ring-4 focus:ring-accentYellow transition-all text-gray-800">
                        </div>
                    </div>

                    <!-- Number & Date Inputs -->
                    <div class="space-y-4 bg-gray-50 p-5 rounded-xl border border-lightBeige">
                        <div>
                            <label for="tp-x_val" class="block text-sm font-bold text-primaryBlue mb-1">X (Number of Items)</label>
                            <input type="number" id="tp-x_val" placeholder="e.g., 5" min="1"
                                class="w-full px-4 py-2 border border-secondaryBlue rounded-lg focus:outline-none focus:ring-2 focus:ring-accentYellow transition-all">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-primaryBlue mb-2 mt-4">Date Setting (yyyy/mm/dd)</label>
                            <div class="grid grid-cols-3 gap-3 border-t border-lightBeige pt-3">
                                <div>
                                    <label for="tp-yyyy" class="block text-xs text-gray-500 mb-1">Year (yyyy)</label>
                                    <input type="number" id="tp-yyyy" placeholder="2026" min="1900" max="2100"
                                        class="w-full px-3 py-2 border border-secondaryBlue rounded-lg focus:outline-none focus:ring-2 focus:ring-accentYellow transition-all text-center">
                                </div>
                                <div>
                                    <label for="tp-mm" class="block text-xs text-gray-500 mb-1">Month (mm)</label>
                                    <input type="number" id="tp-mm" placeholder="12" min="1" max="12"
                                        class="w-full px-3 py-2 border border-secondaryBlue rounded-lg focus:outline-none focus:ring-2 focus:ring-accentYellow transition-all text-center">
                                </div>
                                <div>
                                    <label for="tp-dd" class="block text-xs text-gray-500 mb-1">Day (dd)</label>
                                    <input type="number" id="tp-dd" placeholder="31" min="1" max="31"
                                        class="w-full px-3 py-2 border border-secondaryBlue rounded-lg focus:outline-none focus:ring-2 focus:ring-accentYellow transition-all text-center">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button id="tp-btn-generate" 
                        class="w-full bg-accentYellow text-primaryBlue font-bold py-3 px-6 rounded-xl shadow-md hover:bg-yellow-400 hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 active:translate-y-0 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                        </svg>
                        Generate
                    </button>
                </section>

                <!-- 右側：輸出結果區 -->
                <section class="lg:col-span-7 flex flex-col h-full gap-2 relative">
                    <div class="absolute right-0 top-0 flex gap-2 z-10">
                         <button id="tp-btn-copy" class="text-sm bg-primaryBlue hover:bg-secondaryBlue text-lightBeige font-bold py-1.5 px-4 rounded-lg shadow transition-colors flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            Copy Result
                        </button>
                    </div>
                    
                    <textarea id="tp-output-area" readonly
                        class="w-full flex-grow min-h-[450px] p-5 pt-12 bg-gray-50 border border-secondaryBlue rounded-xl text-gray-800 text-lg leading-relaxed focus:outline-none resize-none shadow-inner"
                    >Please fill in the variables on the left and click "Generate".</textarea>
                </section>
            </div>
        </div>

        <!-- =================== TAB 4: Placeholder =================== -->
        <div id="tab4" class="tab-content w-full bg-white p-8 rounded-2xl shadow-xl flex-col justify-center items-center gap-6 border-t-8 border-primaryBlue min-h-[500px]">
            <i class="fas fa-cogs text-6xl text-secondaryBlue opacity-50 mb-4"></i>
            <h2 class="text-3xl font-bold text-secondaryBlue opacity-70 tracking-widest">TOOL 04 準備中</h2>
            <p class="text-gray-400">未來擴充功能將在此實裝</p>
        </div>

    </main>

    <!-- 最下方顯示 Copyright -->
    <footer class="bg-primaryBlue text-center p-5 shadow-inner mt-auto border-t-4 border-secondaryBlue">
        <p class="text-lightBeige font-medium tracking-wider">Copyright &copy; 2026 Pip_Lin 版權所有</p>
    </footer>

    <script>
        // ==========================================
        // 共用工具函數
        // ==========================================
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        // 產生版本字串
        const generateVersionString = () => {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');
            return `v1.${month}.${day}.${minute}`;
        };

        // 共用下載函數
        const downloadFile = (content, filename) => {
            const blob = new window.Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        };

        // ==========================================
        // Tab 切換邏輯
        // ==========================================
        function switchTab(evt, tabId) {
            // 隱藏所有內容
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            // 移除所有按鈕的 Active 樣式
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-accentYellow', 'text-primaryBlue');
                btn.classList.add('hover:bg-primaryBlue', 'text-lightBeige');
            });
            // 顯示對應內容
            document.getElementById(tabId).classList.add('active');
            // 設定當前點擊按鈕樣式
            evt.currentTarget.classList.add('bg-accentYellow', 'text-primaryBlue');
            evt.currentTarget.classList.remove('hover:bg-primaryBlue', 'text-lightBeige');
        }

        // ==========================================
        // 初始化載入
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const versionString = generateVersionString();
            document.getElementById('ts-version').textContent = versionString;
            document.getElementById('tt-version').textContent = versionString;
        });

        // ==========================================
        // TAB 1: TextShower 邏輯
        // ==========================================
        const tsProcessBtn = document.getElementById('ts-process-btn');
        tsProcessBtn.addEventListener('click', async () => {
            const textArea = document.getElementById('ts-input');
            const progressBar = document.getElementById('ts-progress-bar');
            const statusText = document.getElementById('ts-status-text');

            let text = textArea.value;
            if (!text) return;

            // 鎖定 UI
            tsProcessBtn.disabled = true;
            tsProcessBtn.classList.add('opacity-50', 'cursor-not-allowed');
            textArea.disabled = true;
            textArea.classList.add('opacity-80');

            try {
                // 階段 1
                statusText.textContent = "正在移除特殊括號...";
                progressBar.style.width = "25%";
                await sleep(500); 
                text = text.replace(/【00|】|【/g, "");
                textArea.value = text;

                // 階段 2
                statusText.textContent = "正在處理「發明」、「專利」關鍵字...";
                progressBar.style.width = "50%";
                await sleep(500);
                text = text.replace(/發明|專利/g, "技術");
                textArea.value = text;

                // 階段 3
                statusText.textContent = "正在處理「產業上之可利用性」關鍵字...";
                progressBar.style.width = "75%";
                await sleep(500);
                text = text.replace(/產業上之可利用性/g, "可利用性");
                textArea.value = text;

                // 階段 4
                statusText.textContent = "處理完成，準備下載...";
                progressBar.style.width = "100%";
                await sleep(600);

                const now = new Date();
                const filename = `cont-${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}.txt`;
                
                downloadFile(text, filename);
                statusText.textContent = "下載成功！";
            } catch (error) {
                statusText.textContent = "處理過程中發生錯誤。";
                console.error(error);
            } finally {
                setTimeout(() => {
                    tsProcessBtn.disabled = false;
                    tsProcessBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    textArea.disabled = false;
                    textArea.classList.remove('opacity-80');
                    progressBar.style.width = "0%";
                    statusText.textContent = "";
                }, 3000);
            }
        });

        // ==========================================
        // TAB 2: TextTear 邏輯 (包含更新後的邏輯)
        // ==========================================
        function processTextTear() {
            const inputTextArea = document.getElementById('tt-input');
            const outputTextArea = document.getElementById('tt-output');
            const tearBtn = document.getElementById('tt-process-btn');
            const progressContainer = document.getElementById('tt-progress-container');
            const progressBar = document.getElementById('tt-progress-bar');
            const progressText = document.getElementById('tt-progress-text');
            
            const rawText = inputTextArea.value;
            if (!rawText.trim()) return;

            if(tearBtn) tearBtn.disabled = true;
            outputTextArea.value = '';
            
            progressContainer.classList.remove('hidden');
            setTimeout(() => {
                progressContainer.classList.remove('opacity-0');
                progressContainer.classList.add('opacity-100');
            }, 10);
            
            progressBar.style.width = '0%';
            progressText.innerText = '分析段落中... 0%';

            const paragraphs = rawText.split(/\n+/).filter(p => p.trim() !== '');
            const totalParagraphs = paragraphs.length;

            if (totalParagraphs === 0) {
                if(tearBtn) tearBtn.disabled = false;
                progressContainer.classList.add('hidden');
                return;
            }

            let part1_all_sentences = []; 
            let part2_grouped_sentences = []; 
            let globalCounter = 1; 
            let currentIndex = 0;

            function processChunk() {
                const chunkSize = 5; 
                const endIndex = Math.min(currentIndex + chunkSize, totalParagraphs);

                for (let i = currentIndex; i < endIndex; i++) {
                    const para = paragraphs[i];
                    const groupLabel = `【C${i + 1}】`;
                    part2_grouped_sentences.push(groupLabel);

                    let rawSegments = para.match(/[^；。]+[；。]?/g) || [para];
                    let refinedSegments = [];

                    // 更新的邏輯：處理「1.」開頭並尋找逗號分割
                    rawSegments.forEach(seg => {
                        let text = seg.trim();
                        // 判斷是否為「1.」開頭的句子
                        let match = text.match(/^(1\.\s*)(.*)/);
                        if (match) {
                            let prefixNum = match[1];
                            let restText = match[2];
                            let commaIndex = restText.indexOf('，'); // 尋找第一個全形逗號
                            
                            if (commaIndex !== -1) {
                                // 找到逗號，將逗號前半段與後半段分開成為獨立句子
                                let partA = restText.substring(0, commaIndex);
                                let partB = restText.substring(commaIndex + 1);
                                refinedSegments.push(prefixNum + partA);
                                refinedSegments.push(partB);
                            } else {
                                refinedSegments.push(text);
                            }
                        } else {
                            refinedSegments.push(text);
                        }
                    });

                    refinedSegments.forEach(segment => {
                        let cleanText = segment.trim();
                        if (cleanText) {
                            cleanText = cleanText.replace(/^\d+\.\s*/, '');
                            const formattedSentence = `${globalCounter}.${cleanText}`;
                            
                            part1_all_sentences.push(formattedSentence);
                            part2_grouped_sentences.push(formattedSentence);
                            
                            globalCounter++;
                        }
                    });
                }

                currentIndex = endIndex;
                const progressPercentage = Math.floor((currentIndex / totalParagraphs) * 100);
                progressBar.style.width = `${progressPercentage}%`;
                progressText.innerText = `處理進度: ${progressPercentage}%`;

                if (currentIndex < totalParagraphs) {
                    setTimeout(processChunk, 15); 
                } else {
                    progressText.innerText = '組合文章並準備下載...';
                    
                    setTimeout(() => {
                        const finalText = part1_all_sentences.join('\n') + 
                                          '\n-------\n' + 
                                          part2_grouped_sentences.join('\n');

                        outputTextArea.value = finalText;
                        
                        const now = new Date();
                        const filename = `cult-${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}.txt`;
                        
                        downloadFile(finalText, filename);
                        
                        progressText.innerText = '處理完成！已自動下載';
                        if(tearBtn) tearBtn.disabled = false;
                        
                        setTimeout(() => {
                            progressContainer.classList.remove('opacity-100');
                            progressContainer.classList.add('opacity-0');
                            setTimeout(() => {
                                progressContainer.classList.add('hidden');
                            }, 300);
                        }, 3000);
                    }, 100);
                }
            }

            setTimeout(processChunk, 50);
        }

        // 複製到剪貼簿
        function copyToClipboardTT() {
            const outputTextArea = document.getElementById('tt-output');
            if (!outputTextArea.value) return;

            outputTextArea.select();
            outputTextArea.setSelectionRange(0, 99999); 

            try {
                document.execCommand('copy');
                const copyBtn = document.querySelector('button[onclick="copyToClipboardTT()"]');
                const originalText = copyBtn.innerText;
                copyBtn.innerText = '已複製！';
                copyBtn.classList.replace('bg-primaryBlue', 'bg-accentYellow');
                copyBtn.classList.replace('text-lightBeige', 'text-primaryBlue');
                
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.classList.replace('bg-accentYellow', 'bg-primaryBlue');
                    copyBtn.classList.replace('text-primaryBlue', 'text-lightBeige');
                }, 2000);
            } catch (err) {
                console.error('複製失敗', err);
            }
            window.getSelection().removeAllRanges();
        }

        // ==========================================
        // TAB 3: Prompt Generator 邏輯
        // ==========================================
        const rawTemplate = `你是一位資深且經驗豐富的「DEC」之「IPC」領域，用這幾個敘述並與關鍵字作為檢索式，或是依照你的專業可再延伸其他相關字或衍伸字組合成合適的檢索式，用這檢索式透過「深度學習」與你的專業知識，幫我檢索最相關的專利文件或是學術文章，檢索出來的結果用一個表格呈現，所檢索出來的文件都必須有相似度百分比，最相關最相似100%，最沒相關也不相似的以0%表示，但你只要呈現最高相關百分比大於97.5%相似度的文獻，專利文獻至少要6筆以上，如果有期刊文獻的話期刊文獻至少要2筆以上，用一個表格呈現專利的公開號或公告號或期刊名稱、相似度百分比、日期，完整詳細的呈現上述的相關內容，並要有會選擇這文件的原因。所找的文獻要顯示公開號或公告號，公告日期或公開日期在「yyyy」年「mm」月「dd」日之前。
-------
你是一位具有33年以上經驗的「DEC」之「IPC」領域，非常熟悉了解「IPC」的資深專業人士，現在要做專利技術比對，請閱讀我上傳的文獻檔案，詳細仔細地閱讀理解後利用「深度學習」方式比對相似的段落並用百分比表示相似程度，列出對應的段落描述與段落編號，依據你專業的豐富的經驗與專業知識並用心專注閱讀後，內容依序填入下面的1~「X」項目的標題其內容描述對應的文獻檔案內容段落並指出來是哪個段落有相似，必需利用表格呈現列出顯示，可以直接複製的格式，不要用圖表及CSV呈現，表格的格式列格式為：第一列為「序號」、第二列為「項目標題」、第三列為「對應的文獻段落處指出文章對應的段落」、第四列為「採用原因或無法對應原因」、第五列為「相似度百分比」，用0%到100%百分比來定義相關程度百分比來表示，最高相關就是100%、最不相關的為0%以此類推。但有一點須注意，當你沒辦法比對到或是文獻不相似請用「深度學習」方式透過你對於「IPC」領域通常知識或是「IPC」領域習知技術來說明表示。最後平均總相似度的百分比是多少。接將有比對到的段落用上傳的文件段落直接呈現英文段落，也必須顯示有比對過的段落或頁數。
須注意以下a~c：
a.對應的文獻段落處呈現原本的語言，若是繁體中文就顯示繁體中文、簡體中文就顯示簡體中文、英文就顯示英文
b.如果有「方法」關鍵字請盡量找到對應的流程圖或方法描述
c.如果有「系統」、「電腦可讀媒介」、「裝置」、「設備」關鍵字請盡量找到對應的硬體架構圖`;

        const tpBtnGenerate = document.getElementById('tp-btn-generate');
        const tpBtnCopy = document.getElementById('tp-btn-copy');
        const tpOutputArea = document.getElementById('tp-output-area');

        // 生成邏輯
        tpBtnGenerate.addEventListener('click', () => {
            const dec = document.getElementById('tp-dec').value.trim();
            const ipc = document.getElementById('tp-ipc').value.trim();
            const xVal = document.getElementById('tp-x_val').value.trim();
            const yyyy = document.getElementById('tp-yyyy').value.trim();
            const mm = document.getElementById('tp-mm').value.trim();
            const dd = document.getElementById('tp-dd').value.trim();

            let resultText = rawTemplate;

            const replacePlaceholder = (text, placeholder, value) => {
                const regex = new RegExp(`「${placeholder}」`, 'g');
                return text.replace(regex, value ? value : `「${placeholder}」`);
            };

            resultText = replacePlaceholder(resultText, 'DEC', dec);
            resultText = replacePlaceholder(resultText, 'IPC', ipc);
            resultText = replacePlaceholder(resultText, 'X', xVal);
            resultText = replacePlaceholder(resultText, 'yyyy', yyyy);
            resultText = replacePlaceholder(resultText, 'mm', mm);
            resultText = replacePlaceholder(resultText, 'dd', dd);

            tpOutputArea.value = resultText;
            
            // 按鈕動態回饋 (套用您的品牌色)
            const originalHTML = tpBtnGenerate.innerHTML;
            tpBtnGenerate.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                Generated
            `;
            tpBtnGenerate.classList.replace('bg-accentYellow', 'bg-green-500');
            tpBtnGenerate.classList.replace('text-primaryBlue', 'text-white');
            
            setTimeout(() => {
                tpBtnGenerate.innerHTML = originalHTML;
                tpBtnGenerate.classList.replace('bg-green-500', 'bg-accentYellow');
                tpBtnGenerate.classList.replace('text-white', 'text-primaryBlue');
            }, 2000);
        });

        // 複製邏輯
        tpBtnCopy.addEventListener('click', () => {
            if (tpOutputArea.value === 'Please fill in the variables on the left and click "Generate".' || tpOutputArea.value === '') {
                return; 
            }

            tpOutputArea.select();
            tpOutputArea.setSelectionRange(0, 99999); 

            try {
                document.execCommand('copy');
                const originalHTML = tpBtnCopy.innerHTML;
                tpBtnCopy.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    Copied!
                `;
                tpBtnCopy.classList.replace('bg-primaryBlue', 'bg-green-500');
                
                setTimeout(() => {
                    tpBtnCopy.innerHTML = originalHTML;
                    tpBtnCopy.classList.replace('bg-green-500', 'bg-primaryBlue');
                }, 2000);
            } catch (err) {
                console.error('Copy failed', err);
            }
            window.getSelection().removeAllRanges();
        });
    </script>
